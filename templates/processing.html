<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理中 - Bonding工艺分析工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 800px;
        }
        .card {
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .process-icon {
            font-size: 5rem;
            color: #0d6efd;
            margin-bottom: 1.5rem;
        }
        .progress-container {
            margin: 2rem 0;
        }
        .status-message {
            font-size: 1.1rem;
            color: #6c757d;
        }
        .task-id {
            font-family: monospace;
            background-color: #e9ecef;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }
        .spinner {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-6 text-center">
            <div class="process-icon">
                <i class="bi bi-cog fa-spin"></i>
            </div>
            <h1 class="mb-4">数据处理和模型训练中</h1>
            <p class="text-muted mb-5">您的任务正在处理中，请稍候。这可能需要几分钟时间。</p>
            
            <div class="mb-3">
                <p class="text-muted">任务ID:</p>
                <p class="task-id fs-5"><%= task_id %></p>
            </div>
            
            <div class="progress-container">
                <div class="progress" style="height: 25px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 30%" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
            
            <div id="statusMessage" class="status-message mb-5">
                正在处理数据...
            </div>
            
            <div class="d-flex justify-content-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            
            <div class="mt-5 text-muted">
                <p>请勿关闭此页面。处理完成后将自动跳转。</p>
                <p class="small">如果长时间没有响应，请刷新页面或重新提交任务。</p>
            </div>
        </div>
    </div>

    <script>
        // 轮询检查任务状态
        const taskId = "<%= task_id %>";
        const checkStatus = () => {
            fetch(`/task_status/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    // 更新进度和状态消息
                    if (data.progress) {
                        document.getElementById('progressBar').style.width = `${data.progress}%`;
                        document.getElementById('progressBar').setAttribute('aria-valuenow', data.progress);
                    }
                    
                    if (data.message) {
                        document.getElementById('statusMessage').textContent = data.message;
                    }
                    
                    // 处理完成
                    if (data.status === 'completed') {
                        window.location.href = `/results/${taskId}`;
                    }
                    
                    // 处理错误
                    if (data.status === 'error') {
                        alert(`处理过程中发生错误: ${data.message}`);
                        window.location.href = '/';
                    }
                })
                .catch(error => {
                    console.error('Error checking status:', error);
                });
        };
        
        // 初始检查和定时检查
        checkStatus();
        setInterval(checkStatus, 3000); // 每3秒检查一次
    </script>
</body>
</html>
